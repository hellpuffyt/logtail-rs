name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: "test: ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: "Install stable toolchain"
        uses: dtolnay/rust-toolchain@stable
      - name: "Cache cargo registry and build artifacts"
        uses: Swatinem/rust-cache@v2
      - name: "Run tests: cargo test --all-targets"
        run: cargo test --all-targets

  fmt-clippy:
    name: "fmt and clippy"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Install stable toolchain with clippy and rustfmt"
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: "Cache cargo registry and build artifacts"
        uses: Swatinem/rust-cache@v2
      - name: "Check formatting: cargo fmt --all -- --check"
        run: cargo fmt --all -- --check
      - name: "Lint: cargo clippy --all-targets -- -D warnings"
        run: cargo clippy --all-targets -- -D warnings

  msrv:
    name: "MSRV: 1.85"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Install verified MSRV toolchain (1.85)"
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
      - name: "Cache cargo registry and build artifacts"
        uses: Swatinem/rust-cache@v2
      - name: "Build with MSRV toolchain"
        run: cargo build --all-targets

  smoke:
    name: "release smoke test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Install stable toolchain"
        uses: dtolnay/rust-toolchain@stable
      - name: "Cache cargo registry and build artifacts"
        uses: Swatinem/rust-cache@v2
      - name: "Build release binary"
        run: cargo build --release
      - name: "Generate a sample log"
        run: |
          for i in $(seq 1 5000); do
            status=200
            if [ $((i % 37)) -eq 0 ]; then status=500; fi
            echo "{\"timestamp\":$((1700000000 + i)),\"status\":$status,\"service\":\"api\",\"path\":\"/api/item/$i\",\"latency_ms\":$((i % 250))}" >> sample.log
          done
      - name: "Run a real filter query against the generated log"
        run: ./target/release/logtail sample.log --query "status >= 500" --format ndjson | tee filtered.ndjson
      - name: "Verify the filter query matched records"
        run: |
          count=$(wc -l < filtered.ndjson)
          echo "matched $count records"
          test "$count" -gt 0
      - name: "Run a real aggregation query against the generated log"
        run: ./target/release/logtail sample.log --agg "count,p50(latency_ms),p99(latency_ms)" --group-by service
