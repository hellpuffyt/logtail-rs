[package]
name = "logtail-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Prabesh Sharma"]
description = "Filter and aggregate high-volume structured JSON logs with a query language, streaming a live tail."
license = "MIT"
repository = "https://github.com/hellpuffyt/logtail-rs"
readme = "README.md"
keywords = ["logs", "cli", "streaming", "query", "observability"]
categories = ["command-line-utilities"]

[[bin]]
name = "logtail"
path = "src/main.rs"

[lib]
name = "logtail"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
thiserror = "1"
humantime = "2"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
